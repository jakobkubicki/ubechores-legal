<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "ubeChores" }}</title>
    <meta name="theme-color" content="#1A0B40" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#E9DDF7" media="(prefers-color-scheme: light)">
    <meta name="color-scheme" content="dark light">
    <link rel="icon" href="/brand/favicon-64.png" type="image/png">
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | default: "ubeChores" }}">
    <meta property="og:description" content="ubeChores: happier homes, cleaner days.">
    <meta property="og:image" content="https://chores.ube.games/brand/share.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
    <!-- The same look as www.ube.games: keep the two in step. -->
    <style>
        :root {
            --canvas: #1A0B40;
            --text: #FFFFFF;
            --body: rgba(255, 255, 255, 0.86);
            --muted: rgba(255, 255, 255, 0.74);
            --line: rgba(255, 255, 255, 0.14);
            --card: rgba(255, 255, 255, 0.07);
            --glow-1: rgba(176, 88, 252, 0.34);
            --glow-2: rgba(123, 47, 240, 0.24);
            --ube: #B565FF;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --canvas: #E9DDF7;
                --text: #30136F;
                --body: rgba(48, 19, 111, 0.88);
                --muted: rgba(48, 19, 111, 0.72);
                --line: rgba(48, 19, 111, 0.12);
                --card: #FFFDFB;
                --glow-1: rgba(176, 88, 252, 0.14);
                --glow-2: rgba(123, 47, 240, 0.08);
                --ube: #9635F4;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--canvas);
            color: var(--body);
            font-family: 'Nunito', ui-rounded, system-ui, sans-serif;
            font-weight: 500;
            font-size: 17px;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(560px circle at 15% 6%, var(--glow-1), transparent 70%),
                radial-gradient(480px circle at 95% 70%, var(--glow-2), transparent 70%);
            pointer-events: none;
        }

        .top, main, footer {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            padding-left: 24px;
            padding-right: 24px;
        }

        .top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding-top: 32px;
        }

        .mark {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
            text-decoration: none;
        }

        /* The app's lockup: the mascot, then the wordmark. */
        .mark .mascot { width: 52px; height: auto; }
        .mark .word { height: 24px; width: auto; }


        nav { display: flex; gap: 6px; font-size: 15px; }

        nav a {
            color: var(--muted);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid transparent;
        }

        nav a:hover { color: var(--text); }

        nav a[aria-current="page"] {
            color: var(--text);
            background: var(--card);
            border-color: var(--line);
        }

        main { padding-top: 48px; padding-bottom: 48px; flex: 1; }

        h1 {
            color: var(--text);
            font-weight: 900;
            font-size: clamp(30px, 6vw, 40px);
            line-height: 1.1;
            letter-spacing: -0.02em;
            text-wrap: balance;
            margin: 0 0 12px;
        }

        /* The line under the title ("Effective date: ...") reads as a byline. */
        h1 + p {
            font-weight: 700;
            color: var(--muted);
            margin-top: 0;
        }

        h1 + p strong { font-weight: 700; color: var(--muted); }

        h2 {
            color: var(--text);
            font-weight: 900;
            font-size: 22px;
            line-height: 1.25;
            margin: 44px 0 10px;
            padding-top: 28px;
            border-top: 1px solid var(--line);
        }

        h3 { color: var(--text); font-weight: 700; font-size: 18px; margin: 28px 0 6px; }

        strong { color: var(--text); font-weight: 700; }

        ul, ol { padding-left: 22px; }
        li { margin: 6px 0; }
        li::marker { color: var(--ube); }

        a {
            color: var(--text);
            text-decoration-color: var(--ube);
            text-underline-offset: 3px;
        }

        a:hover { text-decoration-color: var(--ube); }

        code {
            font-size: 0.9em;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 1px 6px;
        }

        hr { border: 0; border-top: 1px solid var(--line); margin: 36px 0; }

        footer {
            padding-top: 24px;
            padding-bottom: 32px;
            font-size: 13px;
            color: var(--muted);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px;
        }

        footer a { color: var(--muted); }
    </style>
</head>
<body>
<div class="top">
    <a class="mark" href="/" aria-label="ubeChores">
        <img class="mascot" src="/brand/mascot.svg" alt="">
        <picture>
            <source srcset="/brand/wordmark-on-light.svg" media="(prefers-color-scheme: light)">
            <img class="word" src="/brand/wordmark-on-dark.svg" alt="ubeChores">
        </picture>
    </a>
    <nav aria-label="ubeChores pages">
        <a href="/"{% if page.url == "/" %} aria-current="page"{% endif %}>Privacy</a>
        <a href="/terms"{% if page.url contains "/terms" %} aria-current="page"{% endif %}>Terms</a>
        <a href="/support"{% if page.url contains "/support" %} aria-current="page"{% endif %}>Support</a>
    </nav>
</div>

<main>
{{ content }}
</main>

<footer>
    <span>© 2026 ube media</span>
    <a href="https://www.ube.games/">ube.games</a>
</footer>
</body>
</html>

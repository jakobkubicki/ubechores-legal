<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "ubeChores" }}</title>
    <meta name="theme-color" content="#0D0B14">
    <link rel="icon" href="/icons/ube.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&family=Fraunces:ital,opsz,wght@1,9..144,400&family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- The same look as www.ube.games: keep the two in step. -->
    <style>
        :root {
            --canvas: #0D0B14;
            --text: #F4F1FA;
            --body: rgba(244, 241, 250, 0.84);
            --muted: rgba(244, 241, 250, 0.62);
            --line: rgba(255, 255, 255, 0.12);
            --card: rgba(255, 255, 255, 0.05);
            --ube: #B44DFF;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--canvas);
            color: var(--body);
            font-family: 'Nunito', ui-rounded, system-ui, sans-serif;
            font-weight: 500;
            font-size: 17px;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(520px circle at 18% 8%, rgba(180, 77, 255, 0.26), transparent 70%),
                radial-gradient(460px circle at 92% 62%, rgba(77, 93, 255, 0.16), transparent 70%);
            pointer-events: none;
        }

        .top, main, footer {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            padding-left: 24px;
            padding-right: 24px;
        }

        .top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding-top: 32px;
        }

        .mark {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
            text-decoration: none;
        }

        .mark img { width: 34px; height: auto; image-rendering: pixelated; }

        .mark span {
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
        }

        nav { display: flex; gap: 6px; font-size: 15px; }

        nav a {
            color: var(--muted);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid transparent;
        }

        nav a:hover { color: var(--text); }

        nav a[aria-current="page"] {
            color: var(--text);
            background: var(--card);
            border-color: var(--line);
        }

        main { padding-top: 48px; padding-bottom: 48px; flex: 1; }

        h1 {
            color: var(--text);
            font-weight: 900;
            font-size: clamp(30px, 6vw, 40px);
            line-height: 1.1;
            letter-spacing: -0.02em;
            text-wrap: balance;
            margin: 0 0 12px;
        }

        /* The line under the title ("Effective date: ...") reads as a byline. */
        h1 + p {
            font-family: 'Fraunces', Georgia, serif;
            font-style: italic;
            color: var(--muted);
            margin-top: 0;
        }

        h1 + p strong { font-weight: 400; }

        h2 {
            color: var(--text);
            font-weight: 900;
            font-size: 22px;
            line-height: 1.25;
            margin: 44px 0 10px;
            padding-top: 28px;
            border-top: 1px solid var(--line);
        }

        h3 { color: var(--text); font-weight: 700; font-size: 18px; margin: 28px 0 6px; }

        strong { color: var(--text); font-weight: 700; }

        ul, ol { padding-left: 22px; }
        li { margin: 6px 0; }
        li::marker { color: var(--ube); }

        a {
            color: var(--text);
            text-decoration-color: rgba(180, 77, 255, 0.6);
            text-underline-offset: 3px;
        }

        a:hover { text-decoration-color: var(--ube); }

        code {
            font-size: 0.9em;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 1px 6px;
        }

        hr { border: 0; border-top: 1px solid var(--line); margin: 36px 0; }

        footer {
            padding-top: 24px;
            padding-bottom: 32px;
            font-size: 13px;
            color: var(--muted);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px;
        }

        footer a { color: var(--muted); }
    </style>
</head>
<body>
<div class="top">
    <a class="mark" href="https://www.ube.games/">
        <img src="/icons/ube.png" alt="">
        <span>ubeChores</span>
    </a>
    <nav aria-label="ubeChores pages">
        <a href="/"{% if page.url == "/" %} aria-current="page"{% endif %}>Privacy</a>
        <a href="/terms"{% if page.url contains "/terms" %} aria-current="page"{% endif %}>Terms</a>
        <a href="/support"{% if page.url contains "/support" %} aria-current="page"{% endif %}>Support</a>
    </nav>
</div>

<main>
{{ content }}
</main>

<footer>
    <span>© 2026 ube media</span>
    <a href="https://www.ube.games/">ube.games</a>
</footer>
</body>
</html>
